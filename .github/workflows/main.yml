name: Check Quality

on: [push, pull_request, workflow_call]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install Poetry
        uses: abatilo/actions-poetry@v2
        with:
          poetry-version: 1.5.1
      - name: Setup Poetry
        run: |
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true
          poetry env info
      - name: Install system dependencies
        run: sudo apt install libev-dev
      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi
      - name: Lint code
        run: poetry run task lint

  test:
    name: Test
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install Poetry
        uses: abatilo/actions-poetry@v2
        with:
          poetry-version: 1.5.1
      - name: Setup Poetry
        run: |
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true
          poetry env info
      - name: Install system dependencies
        run: sudo apt install libev-dev
      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi
      - name: Run all tests
        run: poetry run task test
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Build docker image
        env:
          DOCKER_DEFAULT_PLATFORM: ${{ matrix.platform }}
        run: poetry run task docker
      - name: Build example docker image
        env:
          DOCKER_DEFAULT_PLATFORM: ${{ matrix.platform }}
        run: poetry run task pre_example
      - name: Test example docker image
        env:
          DOCKER_DEFAULT_PLATFORM: ${{ matrix.platform }}
        run: |
          docker run --detach --name microwrap-example --publish 127.0.0.1:3000:80 microwrap-example:latest
          trap 'docker logs microwrap-example; docker rm --force microwrap-example' EXIT
          test "$(curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 1 http://127.0.0.1:3000/)" = '1.0.0'
          test "$(curl --fail --silent --show-error 'http://127.0.0.1:3000/?include-build')" = '1.0.0-b4'
